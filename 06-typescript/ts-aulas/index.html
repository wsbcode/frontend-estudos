<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="description" content="Painel de despesas pessoais em TypeScript e Vite." />
      <title>Painel de Despesas</title>
   </head>
   <body>
      <div id="app" class="layout">
         <aside class="sidebar" aria-label="Resumo financeiro">
            <section class="panel panel--highlight">
               <p class="eyebrow">Total geral</p>
               <strong id="total-geral" class="value value--large">R$ 0,00</strong>
            </section>

            <section class="panel">
               <p class="eyebrow">Totais por categoria</p>
               <ul id="totais-categoria" class="category-summary">
                  <li>
                     <span>Alimento</span><strong data-category-total="alimento">R$ 0,00</strong>
                  </li>
                  <li>
                     <span>Transporte</span
                     ><strong data-category-total="transporte">R$ 0,00</strong>
                  </li>
                  <li><span>Lazer</span><strong data-category-total="lazer">R$ 0,00</strong></li>
                  <li><span>Saúde</span><strong data-category-total="saúde">R$ 0,00</strong></li>
                  <li><span>Outros</span><strong data-category-total="outros">R$ 0,00</strong></li>
               </ul>
            </section>
         </aside>

         <main class="content">
            <section class="panel card">
               <div>
                  <p class="eyebrow">Lançamento rápido</p>
                  <h1>Adicionar despesa</h1>
               </div>

               <form id="form-despesa" class="expense-form" novalidate>
                  <label>
                     <span>Título</span>
                     <input
                        id="titulo"
                        name="titulo"
                        type="text"
                        placeholder="Ex.: Mercado"
                        autocomplete="off"
                        required
                     />
                  </label>

                  <label>
                     <span>Valor</span>
                     <input
                        id="valor"
                        name="valor"
                        type="number"
                        min="0.01"
                        step="0.01"
                        placeholder="0,00"
                        required
                     />
                  </label>

                  <label>
                     <span>Categoria</span>
                     <select id="categoria" name="categoria" required>
                        <option value="" selected disabled>Selecione</option>
                        <option value="alimento">Alimento</option>
                        <option value="transporte">Transporte</option>
                        <option value="lazer">Lazer</option>
                        <option value="saúde">Saúde</option>
                        <option value="outros">Outros</option>
                     </select>
                  </label>

                  <p
                     id="form-feedback"
                     class="form-feedback"
                     role="alert"
                     aria-live="polite"
                     hidden
                  ></p>

                  <button type="submit">Adicionar despesa</button>
               </form>
            </section>

            <section class="panel card">
               <div class="section-header">
                  <div>
                     <p class="eyebrow">Sessão atual</p>
                     <h2>Despesas registradas</h2>
                  </div>
                  <span id="contador-despesas" class="counter">0 itens</span>
               </div>

               <p id="lista-vazia" class="empty-state">Nenhuma despesa registrada.</p>
               <ul id="lista-despesas" class="expense-list" aria-live="polite"></ul>
            </section>
         </main>
      </div>

      <script type="module" src="/src/main.ts"></script>
   </body>
</html>
